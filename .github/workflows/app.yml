# Tests the App when a push to main or a pull request changes it. It's its
# own workflow, so it never slows or blocks CI's deploy, which the App
# doesn't use. Forks never build the App: they use this repository's
# releases.
name: App

on:
  push:
    branches: [main]
    paths: &app
      - "app/**"
      - "ui/**"
      - "src-tauri/**"
      # The Watcher reads the bosses' Defeat Flags from the boss list.
      - "convex/eroverlayBosses.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.app.config.ts"
      - ".github/actions/setup-app/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths: *app

jobs:
  test:
    if: ${{ !github.event.repository.fork }}
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      # The Rust side compiles in the built UI, so it's built first.
      - run: pnpm build:app
      - run: cargo test --locked
        working-directory: src-tauri
      # A release can restore only main's Rust cache, so main builds the
      # release exe too, to put its dependencies in the cache. Pull requests
      # can't save the cache, so they skip it.
      - if: ${{ github.event_name == 'push' }}
        run: pnpm tauri build --no-bundle -- --locked
