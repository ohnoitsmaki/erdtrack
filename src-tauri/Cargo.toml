[package]
name = "erdtrack"
version = "0.6.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.17"
md5 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lists process names to see whether the game is running.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"

# Cargo's normal release settings, which build fast. Exe size doesn't matter.
[profile.release]
strip = true
